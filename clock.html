<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Relo</title>
  <style>
    :root {
      --clock-size: min(78vw, 380px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #eef6ff;
      background:
        radial-gradient(circle at 20% 20%, rgba(52, 211, 153, 0.14), transparent 30%),
        radial-gradient(circle at 80% 75%, rgba(56, 189, 248, 0.14), transparent 32%),
        #09111f;
    }

    .clock-card {
      width: min(92vw, 520px);
      padding: clamp(20px, 5vw, 38px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      text-align: center;
      background: rgba(9, 17, 31, 0.78);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(14px);
    }

    .analog {
      position: relative;
      width: var(--clock-size);
      height: var(--clock-size);
      max-width: 380px;
      max-height: 380px;
      margin: 0 auto 24px;
      border: 3px solid rgba(255, 255, 255, 0.13);
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 0 6px, #09111f 7px),
        repeating-conic-gradient(from 0deg, rgba(255,255,255,.38) 0deg 1deg, transparent 1deg 30deg),
        radial-gradient(circle, #101d30 0 68%, #0c1626 69% 100%);
      box-shadow: inset 0 0 35px rgba(56, 189, 248, 0.08), 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .number {
      position: absolute;
      inset: 18px;
      color: #dceaff;
      font-size: clamp(16px, 4vw, 21px);
      font-weight: 700;
    }

    .number span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--clock-size) * -0.43)) rotate(calc(-1 * var(--angle)));
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 999px;
      transform: translateX(-50%) rotate(0deg);
    }

    .hour { width: 9px; height: 23%; background: #f8fafc; }
    .minute { width: 6px; height: 33%; background: #38bdf8; }
    .second { width: 2px; height: 38%; background: #34d399; }

    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      border: 4px solid #09111f;
      border-radius: 50%;
      background: #34d399;
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    .digital {
      font-variant-numeric: tabular-nums;
      font-size: clamp(42px, 12vw, 72px);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .date {
      margin-top: 12px;
      color: #9fb2c9;
      font-size: clamp(14px, 4vw, 18px);
    }
  </style>
</head>
<body>
  <main class="clock-card" aria-label="Live clock">
    <div class="analog" id="analog">
      <div class="number" aria-hidden="true">
        <span style="--angle:0deg">12</span>
        <span style="--angle:30deg">1</span>
        <span style="--angle:60deg">2</span>
        <span style="--angle:90deg">3</span>
        <span style="--angle:120deg">4</span>
        <span style="--angle:150deg">5</span>
        <span style="--angle:180deg">6</span>
        <span style="--angle:210deg">7</span>
        <span style="--angle:240deg">8</span>
        <span style="--angle:270deg">9</span>
        <span style="--angle:300deg">10</span>
        <span style="--angle:330deg">11</span>
      </div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="pin"></div>
    </div>

    <div class="digital" id="digital" aria-live="polite">00:00:00</div>
    <div class="date" id="date">Petsa</div>
  </main>

  <script>
    const hourHand = document.getElementById('hour');
    const minuteHand = document.getElementById('minute');
    const secondHand = document.getElementById('second');
    const digital = document.getElementById('digital');
    const dateText = document.getElementById('date');

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();

      const secondAngle = (seconds + milliseconds / 1000) * 6;
      const minuteAngle = (minutes + seconds / 60) * 6;
      const hourAngle = ((hours % 12) + minutes / 60) * 30;

      secondHand.style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;

      digital.textContent = [hours, minutes, seconds]
        .map(value => String(value).padStart(2, '0'))
        .join(':');

      dateText.textContent = new Intl.DateTimeFormat('fil-PH', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      }).format(now);

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
