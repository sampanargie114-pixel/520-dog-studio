<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Juan Hosting — Oracle Mesh and auto-healing dashboard.">
  <title>Juan — Oracle Mesh Hosting</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Juan Hosting</h1>
      <p>Oracle Mesh &amp; Auto-Healing Dashboard</p>
    </header>

    <section class="controls" aria-label="Mesh controls">
      <button id="btnAwaken" type="button">Awaken &amp; Replicate Mesh</button>
      <button id="btnCorrupt" class="danger" type="button">Simulate Delete / Corrupt Replica 2</button>
    </section>

    <section class="mesh-grid" id="meshGrid" aria-live="polite" aria-label="Replica status">
      <!-- Dito lilitaw ang status ng mga replicas -->
    </section>

    <section class="logs">
      <h2>Database Logs (Sparks)</h2>
      <div id="dbLogs" class="log-box" aria-live="polite"></div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
